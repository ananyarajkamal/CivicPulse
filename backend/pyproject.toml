# ==============================================================
# CivicPulse Backend — Tool Configuration
# ==============================================================

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print (no print() in production)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "B008", # Do not perform function calls in default arguments (needed for FastAPI)
    "N818", # Exception name should end with Error (our conventions differ)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "S101", "E501"]  # Allow print, assert, and long strings in tests
"app/db/seed.py" = ["T201", "E501"]   # Allow print and long data dicts in seed script
"alembic/versions/**" = ["E501"]      # Allow long schema DDL statements in migrations

# ==============================================================
# mypy — strict type checking
# ==============================================================

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Allow untyped third-party stubs where stubs aren't available
ignore_missing_imports = true

# Be strict about these
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "passlib.*",
    "jose.*",
    "slowapi.*",
    "structlog.*",
]
ignore_missing_imports = true

# ==============================================================
# pytest
# ==============================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
log_cli = true
log_cli_level = "WARNING"
